name: Node.js workflow

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: "The type of runner to use (optional)"

jobs:
  install-and-lint:
    runs-on: ${{ inputs.runner }}
    outputs:
      executable: ${{ steps.find_executable.outputs.executable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - id: find_executable
        name: Find executable
        run: |
          if [ -f package-lock.json ]; then
            echo "executable=npm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then 
            echo "executable=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lockb ]; then 
            echo "executable=bun" >> "$GITHUB_OUTPUT"
          else
            echo "Not a Node.js repo, exiting."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version-file: package.json
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: Install dependencies
        run: sfw ${{ steps.find_executable.outputs.executable }} install
      - name: Run linter
        run: sfw ${{ steps.find_executable.outputs.executable }} run lint
      - name: Audit dependencies
        continue-on-error: true
        run: sfw ${{ steps.find_executable.outputs.executable }} audit
