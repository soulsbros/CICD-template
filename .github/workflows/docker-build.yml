name: Docker build workflow

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "The full name of the image (including user)"
      push:
        required: true
        type: boolean
        description: "Whether to push the image to Docker Hub or not"
      dockerfile:
        type: string
        default: "Dockerfile"
        description: "The name of the Dockerfile (optional)"
      ping_webhook:
        type: boolean
        default: false
        description: "Whether to ping the webhook for deployment or not (optional)"
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      WEBHOOK_URL:
        required: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3.3.0
        if: ${{ inputs.push }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6.7.0
        with:
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image-name }}

  update-image:
    runs-on: ubuntu-latest
    if: ${{ inputs.ping_webhook }}
    steps:
      - name: Notify webhook
        run: curl -X POST ${{ secrets.webhook_url }}
